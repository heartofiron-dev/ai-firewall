[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-firewall"
version = "1.1.0"
description = "Local-first AI-assisted network intrusion detection prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yanxi Li"}]
dependencies = []

[project.optional-dependencies]
comparison = [
    "scikit-learn>=1.7,<2",
    "lightgbm>=4.6,<5",
]
updates = [
    "cryptography>=46,<47",
]

[project.scripts]
ai-firewall = "ai_firewall.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
